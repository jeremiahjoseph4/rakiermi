<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>3D House - Sifen </title>

    <!-- ===== STYLES ===== -->
    <style>
        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #fff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* ----- Loading Screen ----- */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            transition: opacity 0.8s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loader h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #e8d5b0;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(232, 213, 176, 0.2);
        }
        .loader-bar-track {
            width: 180px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e8d5b0, #b8945a);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .loader-percent {
            margin-top: 12px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* ----- ENTER Button ----- */
        #enter-btn {
            position: fixed;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 16px 44px;
            font-size: 1.2rem;
            font-family: 'Georgia', serif;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #e8d5b0;
            background: rgba(20, 18, 30, 0.75);
            border: 1.5px solid rgba(232, 213, 176, 0.4);
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
            opacity: 0;
            pointer-events: none;
            touch-action: manipulation;
        }
        #enter-btn.visible {
            opacity: 1;
            pointer-events: auto;
            animation: pulse-glow 2.4s ease-in-out infinite;
        }
        #enter-btn:active {
            transform: translateX(-50%) scale(0.94);
        }
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(232, 213, 176, 0.05);
            }
            50% {
                box-shadow: 0 8px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(232, 213, 176, 0.12);
            }
        }

        /* ----- HUD Hint ----- */
        #hud-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #hud-hint.visible {
            opacity: 1;
        }
        #hud-hint span {
            display: inline-block;
            margin: 0 6px;
        }

        /* ----- Mobile Joystick ----- */
        #joystick-area {
            position: fixed;
            bottom: 70px;
            left: 30px;
            z-index: 8;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            touch-action: none;
            display: none;
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 38px;
            height: 38px;
            margin: -19px 0 0 -19px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 213, 176, 0.25), rgba(232, 213, 176, 0.04));
            border: 1px solid rgba(232, 213, 176, 0.15);
            pointer-events: none;
            transition: transform 0.05s linear;
        }

        /* ----- Responsive ----- */
        @media (max-width: 768px) {
            #enter-btn {
                padding: 14px 32px;
                font-size: 1.0rem;
                bottom: 12%;
                letter-spacing: 4px;
            }
            #joystick-area {
                display: block;
                width: 80px;
                height: 80px;
                bottom: 50px;
                left: 20px;
            }
            #joystick-knob {
                width: 30px;
                height: 30px;
                margin: -15px 0 0 -15px;
            }
            #hud-hint {
                bottom: 14px;
                font-size: 0.5rem;
            }
            #loader h1 {
                font-size: 1.2rem;
                letter-spacing: 4px;
            }
            .loader-bar-track {
                width: 140px;
            }
        }
        @media (max-width: 480px) {
            #enter-btn {
                padding: 12px 24px;
                font-size: 0.85rem;
                bottom: 10%;
                letter-spacing: 3px;
            }
            #joystick-area {
                width: 64px;
                height: 64px;
                bottom: 40px;
                left: 14px;
            }
            #joystick-knob {
                width: 24px;
                height: 24px;
                margin: -12px 0 0 -12px;
            }
        }
        @media (pointer: coarse) {
            #joystick-area {
                display: block;
            }
        }
        @media (pointer: fine) {
            #joystick-area {
                display: none !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loader">
        <h1>✦ LOADING ✦</h1>
        <div class="loader-bar-track">
            <div class="loader-bar-fill" id="loader-fill"></div>
        </div>
        <div class="loader-percent" id="loader-pct">0%</div>
    </div>

    <!-- ===== 3D CANVAS ===== -->
    <div id="canvas-container"></div>

    <!-- ===== ENTER BUTTON ===== -->
    <button id="enter-btn">✦ ENTER ✦</button>

    <!-- ===== HUD HINT ===== -->
    <div id="hud-hint">
        <span>⌨ WASD</span>
        <span>·</span>
        <span>🖱 Drag</span>
    </div>

    <!-- ===== JOYSTICK (mobile) ===== -->
    <div id="joystick-area">
        <div id="joystick-knob"></div>
    </div>

    <!-- ===== THREE.JS + GSAP from CDN ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/",
                "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm"
            }
        }
    </script>

    <!-- ===== MAIN APPLICATION ===== -->
    <script type="module">
        // ============================================================
        //  MODULE IMPORTS
        // ============================================================
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import gsap from 'gsap';

        // ============================================================
        //  DOM REFS
        // ============================================================
        const container = document.getElementById('canvas-container');
        const loaderEl = document.getElementById('loader');
        const loaderFill = document.getElementById('loader-fill');
        const loaderPct = document.getElementById('loader-pct');
        const enterBtn = document.getElementById('enter-btn');
        const hudHint = document.getElementById('hud-hint');
        const joystickArea = document.getElementById('joystick-area');
        const joystickKnob = document.getElementById('joystick-knob');

        // ============================================================
        //  LOADING
        // ============================================================
        let loadProgress = 0;

        function updateLoader(progress) {
            loadProgress = Math.min(progress, 100);
            loaderFill.style.width = loadProgress + '%';
            loaderPct.textContent = Math.round(loadProgress) + '%';
            if (loadProgress >= 100) {
                setTimeout(() => {
                    loaderEl.classList.add('hidden');
                    enterBtn.classList.add('visible');
                    hudHint.classList.add('visible');
                }, 400);
            }
        }

        let loadTick = 0;
        const loadInterval = setInterval(() => {
            loadTick += 2 + Math.random() * 4;
            updateLoader(loadTick);
            if (loadTick >= 100) {
                clearInterval(loadInterval);
                updateLoader(100);
            }
        }, 80);

        // ============================================================
        //  THREE.JS SETUP
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 25, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance",
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ============================================================
        //  CONTROLS
        // ============================================================
        let orbitControls = null;
        let isInside = false;
        let isTransitioning = false;

        orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.target.set(0, 1.2, 0);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.08;
        orbitControls.minDistance = 3;
        orbitControls.maxDistance = 18;
        orbitControls.maxPolarAngle = Math.PI / 2.1;
        orbitControls.minPolarAngle = 0.1;
        orbitControls.autoRotate = true;
        orbitControls.autoRotateSpeed = 0.5;
        orbitControls.update();

        // ============================================================
        //  LIGHTING
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a2a1a, 0.6);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.8);
        sunLight.position.set(10, 18, 8);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 40;
        sunLight.shadow.camera.left = -20;
        sunLight.shadow.camera.right = 20;
        sunLight.shadow.camera.top = 20;
        sunLight.shadow.camera.bottom = -20;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-8, 4, -6);
        scene.add(fillLight);

        // ============================================================
        //  TEXTURE HELPERS
        // ============================================================
        function createCanvasTexture(width, height, drawFn) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            drawFn(ctx, width, height);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.anisotropy = 4;
            return tex;
        }

        // Wood floor
        const floorTex = createCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#8b6b4a';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const len = 30 + Math.random() * 80;
                const ang = Math.random() * 0.3 - 0.15;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ang);
                ctx.strokeStyle = `rgba(60,40,20,${0.1 + Math.random() * 0.25})`;
                ctx.lineWidth = 1 + Math.random() * 3;
                ctx.beginPath();
                ctx.moveTo(-len / 2, 0);
                ctx.lineTo(len / 2, 0);
                ctx.stroke();
                ctx.restore();
            }
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                ctx.fillStyle = `rgba(40,25,10,${0.03 + Math.random() * 0.08})`;
                ctx.fillRect(x, y, 1 + Math.random() * 3, 1 + Math.random() * 6);
            }
        });

        // Wall
        const wallTex = createCanvasTexture(256, 256, (ctx, w, h) => {
            ctx.fillStyle = '#d4c8b0';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 800; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const r = 1 + Math.random() * 4;
                const bright = 180 + Math.random() * 60;
                ctx.fillStyle = `rgba(${bright},${bright - 20},${bright - 40},${0.04 + Math.random() * 0.06})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // Roof
        const roofTex = createCanvasTexture(256, 256, (ctx, w, h) => {
            ctx.fillStyle = '#5a3a2a';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                ctx.fillStyle = `rgba(40,25,15,${0.1 + Math.random() * 0.2})`;
                ctx.fillRect(x, y, 10 + Math.random() * 20, 2 + Math.random() * 4);
            }
        });

        // Grass
        const grassTex = createCanvasTexture(512, 512, (ctx, w, h) => {
            const colors = ['#4a8a3a', '#3d7a30', '#5a9a4a', '#2d6a20'];
            ctx.fillStyle = '#4a8a3a';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 3000; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const c = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillStyle = c;
                const hh = 2 + Math.random() * 6;
                ctx.fillRect(x, y, 1, hh);
            }
        });

        // ============================================================
        //  BUILD THE HOUSE
        // ============================================================
        const houseGroup = new THREE.Group();
        scene.add(houseGroup);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(40, 40);
        const groundMat = new THREE.MeshStandardMaterial({
            map: grassTex,
            roughness: 0.9,
            metalness: 0.0,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        // House dimensions
        const houseWidth = 5.2;
        const houseDepth = 6.0;
        const houseHeight = 2.8;
        const wallMatBoth = new THREE.MeshStandardMaterial({
            map: wallTex,
            roughness: 0.7,
            metalness: 0.0,
            color: 0xe8dcc8,
            side: THREE.DoubleSide,
        });

        // Floor
        const floorMat = new THREE.MeshStandardMaterial({
            map: floorTex,
            roughness: 0.6,
            metalness: 0.05,
            color: 0x8b6b4a,
        });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(houseWidth - 0.4, houseDepth - 0.4), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, 0.02, 0);
        floor.receiveShadow = true;
        houseGroup.add(floor);

        // Walls
        const wallThick = 0.15;

        // Back wall
        const backWall = new THREE.Mesh(
            new THREE.BoxGeometry(houseWidth, houseHeight, wallThick),
            wallMatBoth
        );
        backWall.position.set(0, houseHeight / 2, -houseDepth / 2);
        backWall.castShadow = true;
        backWall.receiveShadow = true;
        houseGroup.add(backWall);

        // Left wall
        const leftWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThick, houseHeight, houseDepth),
            wallMatBoth
        );
        leftWall.position.set(-houseWidth / 2, houseHeight / 2, 0);
        leftWall.castShadow = true;
        leftWall.receiveShadow = true;
        houseGroup.add(leftWall);

        // Right wall
        const rightWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThick, houseHeight, houseDepth),
            wallMatBoth
        );
        rightWall.position.set(houseWidth / 2, houseHeight / 2, 0);
        rightWall.castShadow = true;
        rightWall.receiveShadow = true;
        houseGroup.add(rightWall);

        // Front wall pieces (with door opening)
        const frontLeft = new THREE.Mesh(
            new THREE.BoxGeometry(houseWidth / 2 - 0.5, houseHeight, wallThick),
            wallMatBoth
        );
        frontLeft.position.set(-houseWidth / 4 - 0.25, houseHeight / 2, houseDepth / 2);
        frontLeft.castShadow = true;
        frontLeft.receiveShadow = true;
        houseGroup.add(frontLeft);

        const frontRight = new THREE.Mesh(
            new THREE.BoxGeometry(houseWidth / 2 - 0.5, houseHeight, wallThick),
            wallMatBoth
        );
        frontRight.position.set(houseWidth / 4 + 0.25, houseHeight / 2, houseDepth / 2);
        frontRight.cast
