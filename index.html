<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Sifen - Inside</title>

    <!-- ===== STYLES ===== -->
    <style>
        /* ----- Reset & Base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #0a0a0f;
            font-family: 'Georgia', 'Times New Roman', serif;
            color: #fff;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            z-index: 0;
        }

        /* ----- Loading Screen ----- */
        #loader {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #0a0a0f;
            transition: opacity 0.8s ease;
        }
        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #loader h1 {
            font-size: 1.8rem;
            font-weight: 300;
            letter-spacing: 6px;
            color: #e8d5b0;
            margin-bottom: 20px;
            text-shadow: 0 0 30px rgba(232, 213, 176, 0.2);
        }
        .loader-bar-track {
            width: 180px;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #e8d5b0, #b8945a);
            border-radius: 2px;
            transition: width 0.3s ease;
        }
        .loader-percent {
            margin-top: 12px;
            font-size: 0.7rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.3);
        }

        /* ----- ENTER Button ----- */
        #enter-btn {
            position: fixed;
            bottom: 14%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            padding: 16px 44px;
            font-size: 1.2rem;
            font-family: 'Georgia', serif;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: #e8d5b0;
            background: rgba(20, 18, 30, 0.75);
            border: 1.5px solid rgba(232, 213, 176, 0.4);
            border-radius: 50px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6);
            transition: all 0.4s ease;
            opacity: 0;
            pointer-events: none;
            touch-action: manipulation;
        }
        #enter-btn.visible {
            opacity: 1;
            pointer-events: auto;
            animation: pulse-glow 2.4s ease-in-out infinite;
        }
        #enter-btn:active {
            transform: translateX(-50%) scale(0.94);
        }
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 8px 40px rgba(0, 0, 0, 0.6), 0 0 20px rgba(232, 213, 176, 0.05);
            }
            50% {
                box-shadow: 0 8px 60px rgba(0, 0, 0, 0.6), 0 0 50px rgba(232, 213, 176, 0.12);
            }
        }

        /* ----- HUD Hint ----- */
        #hud-hint {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            font-size: 0.6rem;
            letter-spacing: 2px;
            color: rgba(255, 255, 255, 0.2);
            text-align: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.8s ease;
        }
        #hud-hint.visible {
            opacity: 1;
        }
        #hud-hint span {
            display: inline-block;
            margin: 0 6px;
        }

        /* ----- Mobile Joystick ----- */
        #joystick-area {
            position: fixed;
            bottom: 70px;
            left: 30px;
            z-index: 8;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            touch-action: none;
            display: none;
        }
        #joystick-knob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 38px;
            height: 38px;
            margin: -19px 0 0 -19px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(232, 213, 176, 0.25), rgba(232, 213, 176, 0.04));
            border: 1px solid rgba(232, 213, 176, 0.15);
            pointer-events: none;
            transition: transform 0.05s linear;
        }

        /* ----- Responsive ----- */
        @media (max-width: 768px) {
            #enter-btn {
                padding: 14px 32px;
                font-size: 1.0rem;
                bottom: 12%;
                letter-spacing: 4px;
            }
            #joystick-area {
                display: block;
                width: 80px;
                height: 80px;
                bottom: 50px;
                left: 20px;
            }
            #joystick-knob {
                width: 30px;
                height: 30px;
                margin: -15px 0 0 -15px;
            }
            #hud-hint {
                bottom: 14px;
                font-size: 0.5rem;
            }
            #loader h1 {
                font-size: 1.2rem;
                letter-spacing: 4px;
            }
            .loader-bar-track {
                width: 140px;
            }
        }
        @media (max-width: 480px) {
            #enter-btn {
                padding: 12px 24px;
                font-size: 0.85rem;
                bottom: 10%;
                letter-spacing: 3px;
            }
            #joystick-area {
                width: 64px;
                height: 64px;
                bottom: 40px;
                left: 14px;
            }
            #joystick-knob {
                width: 24px;
                height: 24px;
                margin: -12px 0 0 -12px;
            }
        }
        @media (pointer: coarse) {
            #joystick-area {
                display: block;
            }
        }
        @media (pointer: fine) {
            #joystick-area {
                display: none !important;
            }
        }

        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>

    <!-- ===== LOADING SCREEN ===== -->
    <div id="loader">
        <h1>✦ LOADING ✦</h1>
        <div class="loader-bar-track">
            <div class="loader-bar-fill" id="loader-fill"></div>
        </div>
        <div class="loader-percent" id="loader-pct">0%</div>
    </div>

    <!-- ===== 3D CANVAS ===== -->
    <div id="canvas-container"></div>

    <!-- ===== ENTER BUTTON ===== -->
    <button id="enter-btn">✦ ENTER ✦</button>

    <!-- ===== HUD HINT ===== -->
    <div id="hud-hint">
        <span>⌨ WASD</span>
        <span>·</span>
        <span>🖱 Drag</span>
    </div>

    <!-- ===== JOYSTICK (mobile) ===== -->
    <div id="joystick-area">
        <div id="joystick-knob"></div>
    </div>

    <!-- ===== THREE.JS + GSAP from CDN ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.163.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.163.0/examples/jsm/",
                "gsap": "https://cdn.jsdelivr.net/npm/gsap@3.12.5/+esm"
            }
        }
    </script>

    <!-- ===== MAIN APPLICATION ===== -->
    <script type="module">
        // ============================================================
        //  MODULE IMPORTS
        // ============================================================
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import gsap from 'gsap';

        // ============================================================
        //  DOM REFS
        // ============================================================
        const container = document.getElementById('canvas-container');
        const loaderEl = document.getElementById('loader');
        const loaderFill = document.getElementById('loader-fill');
        const loaderPct = document.getElementById('loader-pct');
        const enterBtn = document.getElementById('enter-btn');
        const hudHint = document.getElementById('hud-hint');
        const joystickArea = document.getElementById('joystick-area');
        const joystickKnob = document.getElementById('joystick-knob');

        // ============================================================
        //  LOADING
        // ============================================================
        let loadProgress = 0;

        function updateLoader(progress) {
            loadProgress = Math.min(progress, 100);
            loaderFill.style.width = loadProgress + '%';
            loaderPct.textContent = Math.round(loadProgress) + '%';
            if (loadProgress >= 100) {
                setTimeout(() => {
                    loaderEl.classList.add('hidden');
                    enterBtn.classList.add('visible');
                    hudHint.classList.add('visible');
                }, 400);
            }
        }

        let loadTick = 0;
        const loadInterval = setInterval(() => {
            loadTick += 2 + Math.random() * 4;
            updateLoader(loadTick);
            if (loadTick >= 100) {
                clearInterval(loadInterval);
                updateLoader(100);
            }
        }, 80);

        // ============================================================
        //  THREE.JS SETUP
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a2e);
        scene.fog = new THREE.Fog(0x1a1a2e, 25, 50);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(6, 4, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: false,
            powerPreference: "high-performance",
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        container.appendChild(renderer.domElement);

        // ============================================================
        //  CONTROLS
        // ============================================================
        let orbitControls = null;
        let isInside = false;
        let isTransitioning = false;

        orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.target.set(0, 1.2, 0);
        orbitControls.enableDamping = true;
        orbitControls.dampingFactor = 0.08;
        orbitControls.minDistance = 3;
        orbitControls.maxDistance = 18;
        orbitControls.maxPolarAngle = Math.PI / 2.1;
        orbitControls.minPolarAngle = 0.1;
        orbitControls.autoRotate = true;
        orbitControls.autoRotateSpeed = 0.5;
        orbitControls.update();

        // ============================================================
        //  LIGHTING
        // ============================================================
        const ambientLight = new THREE.AmbientLight(0x404060, 0.4);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0x87ceeb, 0x3a2a1a, 0.6);
        scene.add(hemiLight);

        const sunLight = new THREE.DirectionalLight(0xffeedd, 1.8);
        sunLight.position.set(10, 18, 8);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.camera.near = 0.5;
        sunLight.shadow.camera.far = 40;
        sunLight.shadow.camera.left = -20;
        sunLight.shadow.camera.right = 20;
        sunLight.shadow.camera.top = 20;
        sunLight.shadow.camera.bottom = -20;
        sunLight.shadow.bias = -0.001;
        scene.add(sunLight);

        const fillLight = new THREE.DirectionalLight(0x8888ff, 0.3);
        fillLight.position.set(-8, 4, -6);
        scene.add(fillLight);

        // ============================================================
        //  TEXTURE HELPERS
        // ============================================================
        function createCanvasTexture(width, height, drawFn) {
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            drawFn(ctx, width, height);
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.anisotropy = 4;
            return tex;
        }

        // Wood floor
        const floorTex = createCanvasTexture(512, 512, (ctx, w, h) => {
            ctx.fillStyle = '#8b6b4a';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 60; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const len = 30 + Math.random() * 80;
                const ang = Math.random() * 0.3 - 0.15;
                ctx.save();
                ctx.translate(x, y);
                ctx.rotate(ang);
                ctx.strokeStyle = `rgba(60,40,20,${0.1 + Math.random() * 0.25})`;
                ctx.lineWidth = 1 + Math.random() * 3;
                ctx.beginPath();
                ctx.moveTo(-len / 2, 0);
                ctx.lineTo(len / 2, 0);
                ctx.stroke();
                ctx.restore();
            }
            for (let i = 0; i < 200; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                ctx.fillStyle = `rgba(40,25,10,${0.03 + Math.random() * 0.08})`;
                ctx.fillRect(x, y, 1 + Math.random() * 3, 1 + Math.random() * 6);
            }
        });

        // Wall
        const wallTex = createCanvasTexture(256, 256, (ctx, w, h) => {
            ctx.fillStyle = '#d4c8b0';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 800; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const r = 1 + Math.random() * 4;
                const bright = 180 + Math.random() * 60;
                ctx.fillStyle = `rgba(${bright},${bright - 20},${bright - 40},${0.04 + Math.random() * 0.06})`;
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.fill();
            }
        });

        // Roof
        const roofTex = createCanvasTexture(256, 256, (ctx, w, h) => {
            ctx.fillStyle = '#5a3a2a';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                ctx.fillStyle = `rgba(40,25,15,${0.1 + Math.random() * 0.2})`;
                ctx.fillRect(x, y, 10 + Math.random() * 20, 2 + Math.random() * 4);
            }
        });

        // Grass
        const grassTex = createCanvasTexture(512, 512, (ctx, w, h) => {
            const colors = ['#4a8a3a', '#3d7a30', '#5a9a4a', '#2d6a20'];
            ctx.fillStyle = '#4a8a3a';
            ctx.fillRect(0, 0, w, h);
            for (let i = 0; i < 3000; i++) {
                const x = Math.random() * w;
                const y = Math.random() * h;
                const c = colors[Math.floor(Math.random() * colors.length)];
                ctx.fillStyle = c;
                const hh = 2 + Math.random() * 6;
                ctx.fillRect(x, y, 1, hh);
            }
        });

        // ============================================================
        //  BUILD THE HOUSE
        // ============================================================
        const houseGroup = new THREE.Group();
        scene.add(houseGroup);

        // Ground
        const groundGeo = new THREE.PlaneGeometry(40, 40);
        const groundMat = new THREE.MeshStandardMaterial({
            map: grassTex,
            roughness: 0.9,
            metalness: 0.0,
        });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.01;
        ground.receiveShadow = true;
        scene.add(ground);

        // House dimensions
        const houseWidth = 5.2;
        const houseDepth = 6.0;
        const houseHeight = 2.8;
        const wallMatBoth = new THREE.MeshStandardMaterial({
            map: wallTex,
            roughness: 0.7,
            metalness: 0.0,
            color: 0xe8dcc8,
            side: THREE.DoubleSide,
        });

        // Floor
        const floorMat = new THREE.MeshStandardMaterial({
            map: floorTex,
            roughness: 0.6,
            metalness: 0.05,
            color: 0x8b6b4a,
        });
        const floor = new THREE.Mesh(new THREE.PlaneGeometry(houseWidth - 0.4, houseDepth - 0.4), floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.set(0, 0.02, 0);
        floor.receiveShadow = true;
        houseGroup.add(floor);

        // Walls
        const wallThick = 0.15;

        // Back wall
        const backWall = new THREE.Mesh(
            new THREE.BoxGeometry(houseWidth, houseHeight, wallThick),
            wallMatBoth
        );
        backWall.position.set(0, houseHeight / 2, -houseDepth / 2);
        backWall.castShadow = true;
        backWall.receiveShadow = true;
        houseGroup.add(backWall);

        // Left wall
        const leftWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThick, houseHeight, houseDepth),
            wallMatBoth
        );
        leftWall.position.set(-houseWidth / 2, houseHeight / 2, 0);
        leftWall.castShadow = true;
        leftWall.receiveShadow = true;
        houseGroup.add(leftWall);

        // Right wall
        const rightWall = new THREE.Mesh(
            new THREE.BoxGeometry(wallThick, houseHeight, houseDepth),
            wallMatBoth
        );
        rightWall.position.set(houseWidth / 2, houseHeight / 2, 0);
        rightWall.castShadow = true;
        rightWall.receiveShadow = true;
        houseGroup.add(rightWall);

        // Front wall pieces (with door opening)
        const frontLeft = new THREE.Mesh(
            new THREE.BoxGeometry(houseWidth / 2 - 0.5, houseHeight, wallThick),
            wallMatBoth
        );
        frontLeft.position.set(-houseWidth / 4 - 0.25, houseHeight / 2, houseDepth / 2);
        frontLeft.castShadow = true;
        frontLeft.receiveShadow = true;
        houseGroup.add(frontLeft);

        const frontRight = new THREE.Mesh(
            new THREE.BoxGeometry(houseWidth / 2 - 0.5, houseHeight, wallThick),
            wallMatBoth
        );
        frontRight.position.set(houseWidth / 4 + 0.25, houseHeight / 2, houseDepth / 2);
        frontRight.castShadow = true;
        frontRight.receiveShadow = true;
        houseGroup.add(frontRight);

        const frontTop = new THREE.Mesh(
            new THREE.BoxGeometry(1.6, 0.5, wallThick),
            wallMatBoth
        );
        frontTop.position.set(0, houseHeight - 0.25, houseDepth / 2);
        frontTop.castShadow = true;
        frontTop.receiveShadow = true;
        houseGroup.add(frontTop);

        // Ceiling
        const ceilMat = new THREE.MeshStandardMaterial({
            color: 0xf5efe8,
            roughness: 0.9,
            metalness: 0.0,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.4,
        });
        const ceiling = new THREE.Mesh(
            new THREE.PlaneGeometry(houseWidth - 0.4, houseDepth - 0.4),
            ceilMat
        );
        ceiling.rotation.x = Math.PI / 2;
        ceiling.position.set(0, houseHeight - 0.05, 0);
        houseGroup.add(ceiling);

        // Roof
        const roofShape = new THREE.Shape();
        const rw = houseWidth / 2 + 0.6;
        const rh = 1.8;
        roofShape.moveTo(-rw, 0);
        roofShape.lineTo(0, rh);
        roofShape.lineTo(rw, 0);
        roofShape.lineTo(-rw, 0);
        const extrudeSettings = {
            steps: 1,
            depth: houseDepth + 1.2,
            bevelEnabled: true,
            bevelThickness: 0.1,
            bevelSize: 0.05,
            bevelSegments: 4,
        };
        const roofGeo = new THREE.ExtrudeGeometry(roofShape, extrudeSettings);
        const roofMat = new THREE.MeshStandardMaterial({
            map: roofTex,
            roughness: 0.9,
            metalness: 0.0,
            color: 0x6a4a3a,
        });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, houseHeight, -houseDepth / 2 - 0.6);
        roof.castShadow = true;
        roof.receiveShadow = true;
        houseGroup.add(roof);

        // ============================================================
        //  DOOR
        // ============================================================
        const doorGroup = new THREE.Group();
        doorGroup.position.set(0, 0, houseDepth / 2 - 0.05);
        houseGroup.add(doorGroup);

        const frameMat = new THREE.MeshStandardMaterial({
            color: 0x5a3a2a,
            roughness: 0.6,
            metalness: 0.1,
        });
        const frame = new THREE.Mesh(new THREE.BoxGeometry(1.7, 2.5, 0.15), frameMat);
        frame.position.set(0, 1.25, 0);
        frame.castShadow = true;
        doorGroup.add(frame);

        const doorPanel = new THREE.Group();
        doorPanel.position.set(0, 0, 0.1);
        doorGroup.add(doorPanel);

        const doorMat = new THREE.MeshStandardMaterial({
            color: 0x7a5a3a,
            roughness: 0.5,
            metalness: 0.1,
            side: THREE.DoubleSide,
        });
        const doorMesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 2.3, 0.08), doorMat);
        doorMesh.position.set(0, 1.15, 0);
        doorMesh.castShadow = true;
        doorPanel.add(doorMesh);

        const handleMat = new THREE.MeshStandardMaterial({
            color: 0xd4a54a,
            roughness: 0.3,
            metalness: 0.7,
        });
        const handle = new THREE.Mesh(new THREE.SphereGeometry(0.08, 12, 12), handleMat);
        handle.position.set(0.55, 1.2, 0.1);
        doorPanel.add(handle);

        // Door trim
        const trimMat = new THREE.MeshStandardMaterial({
            color: 0x6a4a2a,
            roughness: 0.7,
            metalness: 0.0,
        });
        for (let side of [
                [-0.85, 0],
                [0.85, 0],
                [0, 1.25]
            ]) {
            const isTop = side[1] > 0;
            const trim = new THREE.Mesh(
                new THREE.BoxGeometry(isTop ? 1.7 : 0.1, isTop ? 0.1 : 2.5, 0.1),
                trimMat
            );
            trim.position.set(side[0], side[1], 0.08);
            doorGroup.add(trim);
        }

        // Hinges
        const hingeMat = new THREE.MeshStandardMaterial({
            color: 0x8a7a5a,
            roughness: 0.5,
            metalness: 0.3,
        });
        for (let y of [0.4, 2.0]) {
            const hinge = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.08, 8), hingeMat);
            hinge.rotation.z = Math.PI / 2;
            hinge.position.set(-0.75, y, 0.06);
            doorGroup.add(hinge);
        }

        // ============================================================
        //  WINDOWS
        // ============================================================
        function createWindow(x, y, z, rotY = 0) {
            const winGroup = new THREE.Group();
            winGroup.position.set(x, y, z);
            winGroup.rotation.y = rotY;
            houseGroup.add(winGroup);

            const frameMatW = new THREE.MeshStandardMaterial({
                color: 0x8a7a6a,
                roughness: 0.5,
                metalness: 0.1,
            });
            const glassMat = new THREE.MeshStandardMaterial({
                color: 0x88bbdd,
                roughness: 0.05,
                metalness: 0.1,
                transparent: true,
                opacity: 0.3,
            });
            const ww = 0.7,
                wh = 0.9,
                wd = 0.06;
            const f = new THREE.Mesh(new THREE.BoxGeometry(ww + 0.1, wh + 0.1, wd), frameMatW);
            f.castShadow = true;
            winGroup.add(f);
            const g = new THREE.Mesh(new THREE.BoxGeometry(ww - 0.1, wh - 0.1, wd * 0.5), glassMat);
            g.position.z = 0.03;
            winGroup.add(g);
            const crossMat = new THREE.MeshStandardMaterial({ color: 0x8a7a6a });
            const hBar = new THREE.Mesh(new THREE.BoxGeometry(ww - 0.1, 0.03, wd * 0.6), crossMat);
            hBar.position.z = 0.03;
            winGroup.add(hBar);
            const vBar = new THREE.Mesh(new THREE.BoxGeometry(0.03, wh - 0.1, wd * 0.6), crossMat);
            vBar.position.z = 0.03;
            winGroup.add(vBar);
            return winGroup;
        }

                    console.warn('Failed to load image:', imgUrl);
                    // fallback: draw a placeholder

                    canvas.height = 384;
                    const ctx = canvas.getContext('2d');

                    ctx.textBaseline = 'middle';
                    ctx.fillText('📷', 256, 180);
                    ctx.font = '16px Georgia';
                    ctx.fillText('Image not found', 256, 230);

                    imgMesh.material.map = fallbackTex;
                    imgMesh.material.needsUpdate = true;

                const c = colors[Math.floor(Math.random() * colors.length)];
                const c2 = colors[Math.floor(Math.random() * colors.length)];
                const grad = ctx.createLinearGradient(0, 0, 512, 384);
                grad.addColorStop(0, c);
                grad.addColorStop(1, c2);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, 512, 384);
                for (let i = 0; i < 20; i++) {
                    const xp = Math.random() * 512;
                    const yp = Math.random() * 384;
                    const r = 10 + Math.random() * 60;
                    ctx.fillStyle = `rgba(255,255,255,${0.03 + Math.random() * 0.08})`;
                    ctx.beginPath();
                    ctx.arc(xp, yp, r, 0, Math.PI * 2);
                    ctx.fill();
                }
                const tex = new THREE.CanvasTexture(canvas);
                tex.anisotropy = 4;
                imgMesh.material.map = tex;
                imgMesh.material.needsUpdate = true;

            const frameData = {

        // ============================================================

        // ============================================================
        //  PARTICLE SYSTEMS (effects for the final images)
        // ============================================================
        const particleSystems = [];

        function createParticleSystem(count, color, size, spread, yRange, shape = 'sphere', speed = 0.5) {
            const geo = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const velocities = [];
            const basePositions = [];

            for (let i = 0; i < count; i++) {
                let x, y, z;
                if (shape === 'sphere') {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const r = Math.random() * spread;
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.cos(phi) + yRange[0] + (yRange[1] - yRange[0]) * 0.5;
                    z = r * Math.sin(phi) * Math.sin(theta);
                } else if (shape === 'heart') {
                    const t = Math.random() * Math.PI * 2;
                    const r = spread * 0.3 * (1 + Math.random() * 0.5);
                    const hx = 16 * Math.pow(Math.sin(t), 3);
                    const hy = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                    x = hx * r * 0.03;
                    y = hy * r * 0.03 + yRange[0] + (yRange[1] - yRange[0]) * 0.5;
                    z = (Math.random() - 0.5) * spread * 0.4;
                } else {
                    x = (Math.random() - 0.5) * spread;
                    y = yRange[0] + Math.random() * (yRange[1] - yRange[0]);
                    z = (Math.random() - 0.5) * spread;
                }
                positions[i * 3] = x;
                positions[i * 3 + 1] = y;
                positions[i * 3 + 2] = z;
                basePositions.push({ x, y, z });
                velocities.push({
                    x: (Math.random() - 0.5) * speed * 0.3,
                    y: 0.2 + Math.random() * speed * 0.5,
                    z: (Math.random() - 0.5) * speed * 0.3,
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const mat = new THREE.PointsMaterial({
                color: color,
                size: size,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true,
            });

            const points = new THREE.Points(geo, mat);
            points.position.set(0, 0, -houseDepth / 2 + 0.5);

            const system = {
                points,
                velocities,
                basePositions,
                count,
                spread,
                yRange,
                speed,
                life: 0,
                active: false,
            };
            particleSystems.push(system);
            return system;
        }

        const heartParticles = createParticleSystem(60, 0xff4466, 0.12, 2.5, [0.5, 3.5], 'heart', 0.5);
        const sparkleParticles = createParticleSystem(120, 0xffdd44, 0.05, 3.0, [0.5, 4.0], 'sphere', 0.4);
        const goldenParticles = createParticleSystem(80, 0xd4a54a, 0.08, 2.8, [0.5, 3.8], 'sphere', 0.5);
        const confettiParticles = createParticleSystem(100, 0xff6688, 0.1, 3.2, [0.5, 4.2], 'sphere', 0.6);

        particleSystems.forEach(sys => {

                (Math.random() - 0.5) * 4 - 1
            );

        // ============================================================
        //  FIRST-PERSON CONTROLS (custom)
        // ============================================================
        let fpControls = {
            enabled: false,
            yaw: 0,
            pitch: 0,
            speed: 2.8,
            isLocked: false,
        };

        let isPointerLocked = false;

        document.addEventListener('mousemove', (e) => {
            if (!fpControls.enabled) return;
            if (document.pointerLockElement === renderer.domElement) {
                fpControls.yaw -= e.movementX * 0.002;
                fpControls.pitch -= e.movementY * 0.002;
                fpControls.pitch = Math.max(-1.2, Math.min(1.2, fpControls.pitch));
            }
        });

        document.addEventListener('click', () => {
            if (fpControls.enabled && !isPointerLocked && !isTransitioning) {
                renderer.domElement.requestPointerLock?.();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isPointerLocked = document.pointerLockElement === renderer.domElement;
            fpControls.isLocked = isPointerLocked;
        });

        // Keyboard
        const keys = { w: false, a: false, s: false, d: false };
        document.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = true;
        });
        document.addEventListener('keyup', (e) => {
            const k = e.key.toLowerCase();
            if (k in keys) keys[k] = false;
        });

        // Mobile joystick
        let joystickActive = false;
        let joystickDX = 0,
            joystickDY = 0;

        if (joystickArea) {
            const handleTouch = (e) => {
                e.preventDefault();
                const touch = e.touches[0];
                if (!touch) { joystickActive = false;
                    joystickDX = 0;
                    joystickDY = 0; return; }
                const rect = joystickArea.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const dx = touch.clientX - cx;
                const dy = touch.clientY - cy;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const maxDist = rect.width / 2 - 10;
                const clamped = Math.min(dist, maxDist);
                const angle = Math.atan2(dy, dx);
                const normX = Math.cos(angle) * (clamped / maxDist);
                const normY = Math.sin(angle) * (clamped / maxDist);
                joystickDX = normX;
                joystickDY = normY;
                joystickActive = true;
                joystickKnob.style.transform = `translate(${normX * maxDist}px, ${normY * maxDist}px)`;
            };

            const resetJoystick = () => {
                joystickActive = false;
                joystickDX = 0;
                joystickDY = 0;
                joystickKnob.style.transform = 'translate(0,0)';
            };

            joystickArea.addEventListener('touchstart', handleTouch, { passive: false });
            joystickArea.addEventListener('touchmove', handleTouch, { passive: false });
            joystickArea.addEventListener('touchend', resetJoystick, { passive: false });
            joystickArea.addEventListener('touchcancel', resetJoystick, { passive: false });
        }

        // ============================================================
        //  DOOR INTERACTION
        // ============================================================
        let doorOpen = false;

        function openDoor() {
            if (doorOpen || isTransitioning) return;
            doorOpen = true;
            isTransitioning = true;

            gsap.to(doorPanel.rotation, {
                y: -Math.PI / 1.8,
                duration: 1.8,
                ease: 'power3.inOut',
            });

            gsap.to(handle.position, {
                x: 0.45,
                z: 0.2,
                duration: 1.2,
                ease: 'power2.out',
            });

            enterBtn.classList.remove('visible');

            const startPos = camera.position.clone();
            const startTarget = orbitControls.target.clone();
            const endPos = new THREE.Vector3(0.2, 1.2, houseDepth / 2 - 0.8);
            const endTarget = new THREE.Vector3(0, 1.2, -1);

            gsap.to(camera.position, {
                x: endPos.x,
                y: endPos.y,
                z: endPos.z,
                duration: 2.2,
                ease: 'power2.inOut',
                onUpdate: () => {
                    const t = gsap.utils.interpolate(0, 1, gsap.utils.clamp(0, 1, (camera.position.x - startPos.x) / (
                        endPos.x - startPos.x + 0.001)));
                    orbitControls.target.lerpVectors(startTarget, endTarget, t);
                    orbitControls.update();
                },
                onComplete: () => {
                    isInside = true;
                    orbitControls.enabled = false;
                    orbitControls.autoRotate = false;

                    fpControls.enabled = true;
                    fpControls.yaw = 0;
                    fpControls.pitch = -0.05;
                    renderer.domElement.requestPointerLock?.();
                    updateFPCamera();
                    isTransitioning = false;
                    hudHint.classList.add('visible');

                    // Effects will be triggered by proximity
                }
            });

            gsap.to(orbitControls.target, {
                x: endTarget.x,
                y: endTarget.y,
                z: endTarget.z,
                duration: 2.2,
                ease: 'power2.inOut',
            });
        }

        enterBtn.addEventListener('click', openDoor);
        enterBtn.addEventListener('touchend', (e) => {
            e.preventDefault();
            openDoor();
        });

        // ============================================================
        //  FINAL EFFECTS (triggered when near either final frame)
        // ============================================================
        let effectsTriggered = false;

        function triggerFinalEffects() {
            if (effectsTriggered) return;
            effectsTriggered = true;

            // Animate both final frames
            finalFrames.forEach((gd, idx) => {
                if (!gd) return;
                const delay = idx * 0.2;
                gsap.to(gd.group.position, {
                    z: gd.group.position.z + 0.2,
                    duration: 1.5,
                    delay: delay,
                    ease: 'back.out(1.2)',
                });
                gsap.to(gd.group.scale, {
                    x: 1.08,
                    y: 1.08,
                    z: 1.08,
                    duration: 1.5,
                    delay: delay,
                    ease: 'back.out(1.2)',
                });
                gsap.to(gd.mesh.material, {
                    emissiveIntensity: 0.35,
                    duration: 0.8,
                    delay: delay,
                    yoyo: true,
                    repeat: -1,
                    ease: 'sine.inOut',
                });
            });

            // Activate particles
            particleSystems.forEach((sys, idx) => {
                setTimeout(() => {
                    sys.points.visible = true;
                    sys.active = true;
                    sys.life = 0;
                    const pos = sys.points.geometry.attributes.position;
                    for (let i = 0; i < sys.count; i++) {
                        const base = sys.basePositions[i];
                        pos.array[i * 3] = base.x + (Math.random() - 0.5) * 0.5;
                        pos.array[i * 3 + 1] = base.y + (Math.random() - 0.5) * 0.5;
                        pos.array[i * 3 + 2] = base.z + (Math.random() - 0.5) * 0.5;
                    }
                    pos.needsUpdate = true;
                }, idx * 200);
            });

            // Confetti burst
            const confettiSys = particleSystems[3];
            if (confettiSys) {
                const pos = confettiSys.points.geometry.attributes.position;
                for (let i = 0; i < confettiSys.count; i++) {
                    pos.array[i * 3] = (Math.random() - 0.5) * 4;
                    pos.array[i * 3 + 1] = 0.5 + Math.random() * 3.5;
                    pos.array[i * 3 + 2] = (Math.random() - 0.5) * 4 - 0.5;
                }
                pos.needsUpdate = true;
                confettiSys.points.visible = true;
                confettiSys.active = true;
            }

            // Slight camera sway
            gsap.to(camera.position, {
                x: camera.position.x + 0.2,
                duration: 2.0,
                ease: 'sine.inOut',
                yoyo: true,
                repeat: 1,
            });
        }

        // ============================================================
        //  UPDATE FUNCTIONS
        // ============================================================
        function updateFPCamera() {
            const euler = new THREE.Euler(fpControls.pitch, fpControls.yaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        function updateFPControls(delta) {
            if (!fpControls.enabled || isTransitioning) return;

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(
                new THREE.Quaternion().setFromEuler(new THREE.Euler(0, fpControls.yaw, 0))
            );
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(
                new THREE.Quaternion().setFromEuler(new THREE.Euler(0, fpControls.yaw, 0))
            );

            let moveX = 0,
                moveZ = 0;
            if (keys.w) { moveX += forward.x;
                moveZ += forward.z; }
            if (keys.s) { moveX -= forward.x;
                moveZ -= forward.z; }
            if (keys.a) { moveX -= right.x;
                moveZ -= right.z; }
            if (keys.d) { moveX += right.x;
                moveZ += right.z; }

            if (joystickActive) {
                const jf = new THREE.Vector3(0, 0, -joystickDY).applyQuaternion(
                    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, fpControls.yaw, 0))
                );
                const jr = new THREE.Vector3(joystickDX, 0, 0).applyQuaternion(
                    new THREE.Quaternion().setFromEuler(new THREE.Euler(0, fpControls.yaw, 0))
                );
                moveX += jf.x + jr.x;
                moveZ += jf.z + jr.z;
            }

            const len = Math.sqrt(moveX * moveX + moveZ * moveZ);
            if (len > 0) {
                moveX /= len;
                moveZ /= len;
            }

            const speed = fpControls.speed * delta;
            const newPos = camera.position.clone();
            newPos.x += moveX * speed;
            newPos.z += moveZ * speed;

            const margin = 0.3;
            const halfW = houseWidth / 2 - margin;
            const halfD = houseDepth / 2 - margin;
            newPos.x = Math.max(-halfW, Math.min(halfW, newPos.x));
            newPos.z = Math.max(-halfD, Math.min(halfD, newPos.z));

            camera.position.copy(newPos);
            camera.position.y = 1.2;

            updateFPCamera();

            // Update each final frame scale based on distance
            finalFrames.forEach((gd) => {
                if (!gd) return;
                const dist = camera.position.distanceTo(
                    new THREE.Vector3(gd.x, gd.y, gd.z)
                );
                const scaleFactor = Math.max(1, 3.5 - dist * 0.3);
                const s = Math.min(2.0, Math.max(1.0, scaleFactor));
                const current = gd.group.scale.x;
                const target = s * 0.9;
                const newS = current + (target - current) * 0.06;
                gd.group.scale.set(newS, newS, newS);
            });

            // Check proximity to any final frame
            if (!effectsTriggered) {
                let near = false;
                for (const gd of finalFrames) {
                    if (!gd) continue;
                    const dist = camera.position.distanceTo(
                        new THREE.Vector3(gd.x, gd.y, gd.z)
                    );
                    if (dist < 2.8) {
                        near = true;
                        break;
                    }
                }
                if (near) {
                    triggerFinalEffects();
                }
            }
        }

        // ============================================================
        //  ANIMATION LOOP
        // ============================================================
        const clock = new THREE.Clock();

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            const elapsed = clock.elapsedTime;

            if (!isInside && orbitControls.enabled) {
                orbitControls.update();
            }

            if (fpControls.enabled) {
                updateFPControls(delta);
            }

            // Animate all frames (including final ones)
            frames.forEach((f) => {
                const pulse = Math.sin(elapsed * 0.8 + f.pulsePhase) * 0.5 + 0.5;
                if (f.isGolden) {
                    const intensity = 0.05 + pulse * 0.25;
                    f.mesh.material.emissiveIntensity = intensity;
                    if (f.sprite) {
                        const s = 2.0 + pulse * 0.8;
                        f.sprite.scale.set(s, s, 1);
                        f.sprite.material.opacity = 0.3 + pulse * 0.4;
                    }
                } else {
                    const dist = camera.position.distanceTo(
                        new THREE.Vector3(f.x, f.y, f.z)
                    );
                    const glow = Math.max(0, 1 - dist / 6) * 0.15;
                    f.mesh.material.emissiveIntensity = glow + 0.02;
                }
            });

            // Update particles
            particleSystems.forEach(sys => {
                if (!sys.active || !sys.points.visible) return;
                sys.life += delta;
                const pos = sys.points.geometry.attributes.position;
                const arr = pos.array;
                for (let i = 0; i < sys.count; i++) {
                    const idx = i * 3;
                    const base = sys.basePositions[i];
                    arr[idx + 1] += sys.velocities[i].y * delta * 0.5;
                    arr[idx] += Math.sin(elapsed + i) * delta * 0.1;
                    arr[idx + 2] += Math.cos(elapsed * 0.7 + i * 0.5) * delta * 0.1;
                    if (arr[idx + 1] > sys.yRange[1] + 0.5) {
                        arr[idx + 1] = sys.yRange[0] + Math.random() * 0.5;
                        arr[idx] = base.x + (Math.random() - 0.5) * 0.5;
                        arr[idx + 2] = base.z + (Math.random() - 0.5) * 0.5;
                    }
                }
                pos.needsUpdate = true;
                const lifeNorm = Math.min(1, sys.life / 1.5);
                sys.points.material.opacity = Math.min(1, lifeNorm * 0.9);
            });

            // Ambient hearts
            ambientHearts.forEach((h, idx) => {
                if (!h.active) return;
                h.life += delta;
                const pos = h.points.geometry.attributes.position;
                const arr = pos.array;
                arr[1] += Math.sin(elapsed * h.speed + idx) * delta * 0.15;
                arr[0] += Math.sin(elapsed * 0.5 + idx * 1.3) * delta * 0.06;
                arr[2] += Math.cos(elapsed * 0.4 + idx * 0.9) * delta * 0.06;
                if (arr[1] > 3.5) arr[1] = 0.5;
                if (arr[1] < 0.3) arr[1] = 3.5;
                if (arr[0] > 2.2) arr[0] = -2.2;
                if (arr[0] < -2.2) arr[0] = 2.2;
                if (arr[2] > 1.5) arr[2] = -3.5;
                if (arr[2] < -3.5) arr[2] = 1.5;
                pos.needsUpdate = true;
                h.points.material.opacity = 0.3 + Math.sin(elapsed * 0.6 + idx) * 0.2;
            });

            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        animate();

        // ============================================================
        //  RESIZE
        // ============================================================
        window.addEventListener('resize', () => {
            const w = window.innerWidth;
            const h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        });

        // ============================================================
        //  INIT
        // ============================================================
        console.log('🏠 3D House with Two Final Images');
        console.log('📸 Place photo1.jpg and photo2.jpg in the same folder as index.html');
        console.log('🖱 Drag to look, WASD to move, or use joystick on mobile');
        console.log('✨ Approach the two golden frames to trigger effects!');

        // ============================================================
        //  IMAGE REPLACEMENT GUIDE
        // ============================================================
        /*
         *  TO REPLACE THE FINAL IMAGES:
         *  1. Place your images in the same folder as index.html
         *  2. Name them 'photo1.jpg' and 'photo2.jpg' (or update the filenames
         *     in the createPictureFrame calls for the final frames)
         *  3. The frames will display your images with a beautiful glow
         *
         *  Supported formats: jpg, png, webp
         */
        console.log('📸 Final images: photo1.jpg (left) and photo2.jpg (right)');
    </script>
</body>
